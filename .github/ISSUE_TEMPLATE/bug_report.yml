name: Bug Report
description: Report a bug, radio connection problem, or UI issue in Core Companion
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue. Please fill out the details below so we can reproduce and fix it quickly.

  - type: dropdown
    id: edition
    attributes:
      label: App Edition
      description: Which edition of Core Companion are you running?
      options:
        - Core Companion (Full Suite)
        - Core Companion (MeshCore Client)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App Version / Tag
      description: Found in Settings -> App Updates (e.g., v0.7.13+37, v0.8.0-rc1-6697d76, or client-v1.3.0)
      placeholder: "v0.7.13+37"
    validations:
      required: true

  - type: dropdown
    id: transport
    attributes:
      label: Radio Connection Type
      options:
        - Bluetooth Low Energy (BLE)
        - USB Serial (OTG)
        - TCP / KISS Network
        - Not connected / Offline UI only
    validations:
      required: true

  - type: input
    id: phone_device
    attributes:
      label: Phone / Host Device & Operating System
      description: Phone/tablet model and Android/OS version (e.g., Samsung Galaxy S23 running Android 14, Pixel 8 running Android 15 / GrapheneOS).
      placeholder: "Samsung Galaxy S23 (Android 14)"
    validations:
      required: true

  - type: input
    id: companion_radio
    attributes:
      label: Companion Radio Hardware & Firmware (Optional)
      description: LoRa board model, chipset, and companion firmware version if this issue involves radio operation.
      placeholder: "Heltec WiFi LoRa 32 V3 (ESP32-S3 + SX1262) - MeshCore companion v1.2.4"
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug and the steps that led to it.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or Screenshots (Optional)
      description: Paste any relevant RX Log entries, error messages, or attach screenshots.
