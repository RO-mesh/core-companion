name: Bug Report
description: Report a bug, radio connection problem, or UI issue in Core Companion
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue. Please fill out the details below so we can reproduce and fix it quickly.

  - type: dropdown
    id: edition
    attributes:
      label: App Edition
      description: Which edition of Core Companion are you running?
      options:
        - Core Companion (Full Suite)
        - Core Companion (MeshCore Client)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App Version / Tag
      description: Found in Settings -> App Updates (e.g., v0.7.13+37, v0.8.0-rc1-6697d76, or client-v1.3.0)
      placeholder: "v0.7.13+37"
    validations:
      required: true

  - type: dropdown
    id: transport
    attributes:
      label: Radio Connection Type
      options:
        - Bluetooth Low Energy (BLE)
        - USB Serial (OTG)
        - TCP / KISS Network
        - Not connected / Offline UI only
    validations:
      required: true

  - type: input
    id: hardware
    attributes:
      label: Phone & Companion Radio Hardware
      description: Android model/OS version and LoRa board (e.g., Pixel 8 Android 15 + Heltec V3 / T-Beam / RAK4631)
      placeholder: "Samsung S23 (Android 14) + Heltec V3 running MeshCore companion"

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug and the steps that led to it.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or Screenshots (Optional)
      description: Paste any relevant RX Log entries, error messages, or attach screenshots.
