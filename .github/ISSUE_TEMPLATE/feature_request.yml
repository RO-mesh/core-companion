name: Feature Request
description: Suggest a new radio tool, module, or improvement for Core Companion
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: edition
    attributes:
      label: Target Edition
      options:
        - Both Editions
        - Core Companion (Full Suite)
        - Core Companion (MeshCore Client)
    validations:
      required: true

  - type: input
    id: target_hardware
    attributes:
      label: Target Radio Hardware / Board Model (Optional)
      description: Specify if this feature targets specific radio boards, chipsets, or peripherals (e.g., Heltec V3, T-Beam, RAK4631, E-Ink screens, GPS-equipped nodes, rotary encoder, LilyGO T-Deck keyboard). Leave blank if universal.
      placeholder: "Universal UI / Heltec V3 / LilyGO T-Deck / GPS-equipped nodes"
    validations:
      required: false

  - type: textarea
    id: problem
    attributes:
      label: Use Case / Problem to Solve
      description: How would this feature help during radio operation or off-grid use?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe how you envision this working.
    validations:
      required: true
